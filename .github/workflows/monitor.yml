name: monitor-level

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: monitor-level
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore state cache
        uses: actions/cache@v4.2.3
        with:
          path: state.json
          key: level-state-${{ github.run_id }}
          restore-keys: |
            level-state-

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_THRESHOLD: "350"
        # 50 pasadas x 1 min = ~50 min de cobertura continua por run.
        # El cron dispara cada 5 min pero GitHub lo corre cada ~45-60 min en la práctica;
        # con runs solapados (cancel-in-progress: false) siempre hay uno activo.
        run: |
          for i in $(seq 1 50); do
            echo "--- Pasada $i/50 ---"
            python monitor.py
            if [ $i -lt 50 ]; then sleep 60; fi
          done
