name: monitor-level

on:
  schedule:
    # Cada 30 min. Ojo: el cron de GitHub no es exacto y puede demorarse en horas pico.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: read

concurrency:
  group: monitor-level
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # Persiste state.json entre corridas para no repetir alertas.
      # La key cambia en cada run; restore-keys recupera el cache más reciente.
      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: level-state-${{ github.run_id }}
          restore-keys: |
            level-state-

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
