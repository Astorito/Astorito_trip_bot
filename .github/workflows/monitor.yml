name: monitor-level

on:
  schedule:
    # Cada 5 min (mínimo posible en GitHub Actions).
    # En horas pico puede demorarse 5-15 min extra, pero para atrapar promos alcanza.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: read

concurrency:
  group: monitor-level
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore state cache
        uses: actions/cache@v4.2.3
        with:
          path: state.json
          key: level-state-${{ github.run_id }}
          restore-keys: |
            level-state-

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # 5 pasadas con 1 min de pausa = cobertura efectiva cada ~1 min
        # (el cron dispara cada 5 min, este bloque cubre el tiempo entre disparos)
        run: |
          for i in 1 2 3 4 5; do
            echo "--- Pasada $i/5 ---"
            python monitor.py
            if [ $i -lt 5 ]; then sleep 60; fi
          done
